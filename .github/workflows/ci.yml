name: ClaimAuditAI CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          else
            pip install torch==2.1.0 --index-url https://download.pytorch.org/whl/cpu
          fi
          pip install -r requirements.txt
      - name: Run tests with coverage
        run: |
          python -m pytest src/python/tests/ -v --tb=short --cov=src/python --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          file: ./coverage.xml
          flags: python

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: cd ui && npm install --legacy-peer-deps
      - name: Lint
        run: cd ui && npx eslint src/
      - name: Type check
        run: cd ui && npx tsc --noEmit
      - name: Run tests
        run: cd ui && npx vitest run --coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          flags: frontend

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [python-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build frontend
        run: cd ui && npm install --legacy-peer-deps && npm run build
      - name: Verify build output
        run: |
          if [ ! -d "ui/dist" ]; then
            echo "Build failed: ui/dist not found"
            exit 1
          fi
          echo "Frontend build successful ($(du -sh ui/dist | cut -f1))"
