services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claimaudit-iris
    env_file: 
      - .env
    restart: always
    environment:
      - ISC_CPF_MERGE_FILE=/home/irisowner/dev/merge.cpf
    ports:
      - "1972:1972"
      - "52773:52773"
      - "8080:8080"
    volumes:
      - ./:/home/irisowner/dev

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile.ui
    container_name: claimaudit-ui
    ports:
      - "3000:80"
    depends_on:
      - iris
    restart: always
